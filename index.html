<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gol! - FIFA World Cup 2026</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#1a1a2e">
<meta name="description" content="FIFA World Cup 2026 fan app - Match schedule, predictions and more for Indian fans">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0d0d1a;color:#fff;min-height:100vh}
#update-banner{display:none;position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:#f0a500;color:#000;padding:0.75rem 1.5rem;border-radius:30px;font-weight:700;font-size:0.9rem;cursor:pointer;z-index:9999;box-shadow:0 4px 20px rgba(240,165,0,0.5);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 4px 20px rgba(240,165,0,0.5)}50%{box-shadow:0 4px 30px rgba(240,165,0,0.8)}}
</style>
</head>
<body>
<div id="update-banner" onclick="location.reload()">🔄 New update available! Tap to refresh</div>
<div id="app">Loading Gol!...</div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="js/firebase.js"></script>
<script src="js/matches.js"></script>
<script src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data && e.data.type === 'UPDATE_AVAILABLE') {
      document.getElementById('update-banner').style.display = 'block';
    }
  });
}
</script>
</body>
</html>
