name: Sync live match data

# Server-side ESPN → Firebase sync so browser clients can be read-only instead
# of every visitor fetching ESPN and writing to the database.
on:
  schedule:
    # Every 10 minutes. GitHub cron is best-effort and may be delayed a few
    # minutes under load — fine for group-stage scores. Bump to '*/5' during the
    # tournament if you want tighter live updates.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}   # manual "Run workflow" button in the Actions tab

# Don't let a slow run overlap the next scheduled one.
concurrency:
  group: sync-live-data
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install firebase-admin@12

      - name: Sync ESPN live data to Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/sync-live-data.mjs
