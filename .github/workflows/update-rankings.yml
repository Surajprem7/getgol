name: Update FIFA Rankings

on:
  schedule:
    # Rankings are now Elo-calculated inside sync-live-data.mjs.
    # This workflow is kept so the schedule doesn't break; it logs and exits cleanly.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Note — rankings now handled by Elo sync
        run: node scripts/update-rankings.mjs
